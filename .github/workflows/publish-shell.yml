name: Publish signed program update
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['updates/publish.json']
permissions:
  contents: write
  actions: read
  statuses: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Report started
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state=pending -f context=starling/publish -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - uses: actions/checkout@v4
      - name: Read signed release metadata
        id: meta
        run: |
          echo "run_id=$(jq -er '.runId | numbers' updates/publish.json)" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -er '.versionCode | numbers' updates/publish.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: Starling-Filament-3.0-alpha
          run-id: ${{ steps.meta.outputs.run_id }}
          github-token: ${{ github.token }}
          path: /tmp/starling
      - name: Apply offline signature and verify
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          python updates/publish.py /tmp/starling/app-debug.apk
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          signer="$sdk/build-tools/35.0.0/apksigner"
          aapt="$sdk/build-tools/35.0.0/aapt"
          apk="updates/starling-v$VERSION.apk"
          "$signer" verify --verbose --print-certs "$apk" | tee /tmp/cert.txt
          grep -F 'Signer #1 certificate SHA-256 digest: 393da066780f599c8151cbf70a564b72ff3e60f0bcd05aa38fa52f74dd60efe2' /tmp/cert.txt
          "$aapt" dump badging "$apk" | head -n 1 | grep -F "package: name='com.xs.character.viewer' versionCode='$VERSION'"
      - name: Publish only verified program APK
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "updates/starling-v$VERSION.apk" app-update.json
          git commit -m "Publish signed program update $VERSION"
          git push origin HEAD:main
      - name: Report result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state=failure
          if [ "$JOB_STATUS" = success ]; then state=success; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$state" -f context=starling/publish -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
