name: Starling native Android
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'native-v3/**'
      - '.github/workflows/starling-native.yml'
permissions:
  contents: read
  statuses: write
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Report build started
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state=pending -f context=starling/native-android -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Use preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          manager="$(find "$sdk/cmdline-tools" -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -x "$manager"
          if [ ! -f "$sdk/platforms/android-35/android.jar" ] || [ ! -x "$sdk/build-tools/35.0.0/apksigner" ]; then
            "$manager" --sdk_root="$sdk" 'platforms;android-35' 'build-tools;35.0.0'
          fi
          test -f "$sdk/platforms/android-35/android.jar"
          test -x "$sdk/build-tools/35.0.0/apksigner"
      - name: Generate project
        run: bash native-v3/bootstrap.sh
      - name: Compile native APK
        run: gradle -p native-v3 :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK signature
        run: '"$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose native-v3/app/build/outputs/apk/debug/app-debug.apk'
      - uses: actions/upload-artifact@v4
        with:
          name: Starling-Filament-3.0-alpha
          path: native-v3/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Report final build status
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state=failure
          if [ "$JOB_STATUS" = success ]; then state=success; fi
          if [ "$JOB_STATUS" = cancelled ]; then state=error; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$state" -f context=starling/native-android -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
